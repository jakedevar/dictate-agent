# CPU-only CI. It runs the same gate a worker runs locally (`just check-cpu`),
# the desktop UI tests, and an install-story smoke. It needs no GPU, no secrets,
# no model files and no network fixtures (the only network use is crates, bun
# packages and the ONNX Runtime download the VAD crate's build script does).
# It never publishes: there is no release, tag, upload or token anywhere in
# this file. Releases are an operator gate (docs/INSTALL.md).
name: ci

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

# Read-only token; fork PRs get no secrets regardless, and this workflow
# references none.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  # clippy -D warnings must not flip red because a new stable shipped; bump on purpose.
  RUST_TOOLCHAIN: "1.94.1"

jobs:
  check-cpu:
    name: just check-cpu + install smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake clang libclang-dev pkg-config ripgrep \
            libasound2-dev libssl-dev
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - uses: extractions/setup-just@v2
      # tests, clippy (incl. the e2e-real and x11-tests feature lines), fmt, and
      # the dictate-cli dependency-tree check. No CUDA: the default build is CPU.
      - name: just check-cpu
        run: just check-cpu
      # Installs the staged tarball and `make install-files` into a temp HOME.
      - name: Install smoke (tarball + make, temp directory)
        run: scripts/install-smoke.sh --bindir target/debug --variant cpu
      - name: Workflow stays secret-free and publish-free
        run: |
          ! grep -rnE 'secrets[.]|gh release|softprops|upload-release|cargo publish' .github/workflows

  ui:
    name: ui tests
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: System packages (Tauri on Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "ui/src-tauri -> ../../target"
      - uses: extractions/setup-just@v2
      - uses: oven-sh/setup-bun@v2
      # frozen lockfile, typecheck, bun test, then the Rust bridge/HUD tests and clippy
      - name: just ui-test
        run: just ui-test
