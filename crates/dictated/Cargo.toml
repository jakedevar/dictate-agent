[package]
name = "dictated"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "dictated"
path = "src/lib.rs"

[[bin]]
name = "dictated"
path = "src/main.rs"

[features]
# Build the daemon with the whisper.cpp CUDA backend (what `just install` and
# `just release` ship). Off by default: see crates/dictate-stt/Cargo.toml.
cuda = ["dictate-core/cuda"]
# Real-hardware end-to-end tests (`tests/e2e_real.rs`): real Whisper on CUDA with
# the installed model, real Silero VAD, a real in-process daemon. Off by default
# so no ordinary `cargo test` needs a GPU or a model; run with `just e2e`.
e2e-real = []

[[test]]
name = "e2e_real"
path = "tests/e2e_real.rs"
required-features = ["e2e-real"]

[dependencies]
dictate-dict = { workspace = true }
anyhow = { workspace = true }
dictate-core = { workspace = true }
dictate-vad = { workspace = true }
dictate-fmt = { workspace = true }
dictate-history = { workspace = true }
dictate-hotkey = { workspace = true }
dictate-proto = { workspace = true }
dictate-server = { workspace = true }
dictate-stt = { workspace = true }
libc = { workspace = true }
serde_json = { workspace = true }
signal-hook = { workspace = true }
signal-hook-tokio = { workspace = true }
tokio = { workspace = true }
tokio-stream = { workspace = true }
toml_edit = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[dev-dependencies]
toml = { workspace = true }
# S33 network API tests: the WebSocket client, the same version axum links.
tokio-tungstenite = "0.29"
futures-util = { workspace = true }
base64 = { workspace = true }
# `test-support` compiles the port doubles into dictate-core so the integration
# tests can start a real daemon with no microphone, GPU, or desktop.
dictate-core = { workspace = true, features = ["test-support"] }
hound = { workspace = true }
