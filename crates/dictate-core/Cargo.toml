[package]
name = "dictate-core"
version.workspace = true
edition.workspace = true

[features]
# Compiles the deterministic port doubles in `ports::mock` into the library so
# integration tests in *other* crates (notably `dictated`) can drive the real
# engine and the real socket without a microphone, a GPU, or a desktop.
test-support = []
# whisper.cpp CUDA backend. Off by default so `--workspace` builds, tests and
# clippy stay CPU-only; `dictated/cuda` forwards here.
cuda = ["dictate-stt/cuda"]

[dependencies]
dictate-dict = { workspace = true }
anyhow = { workspace = true }
arboard = { workspace = true }
dictate-audio = { workspace = true }
dictate-context = { workspace = true }
dictate-fmt = { workspace = true }
dictate-history = { workspace = true }
dictate-inject = { workspace = true }
dictate-proto = { workspace = true }
# `[api]` (S33): the leaf owns its config struct; the server itself is wired by
# `dictated`.
dictate-server = { workspace = true }
dictate-stt = { workspace = true, features = ["transcribe"] }
dictate-vad = { workspace = true }
uuid = { workspace = true }
notify-rust = { workspace = true }
ollama-rs = { workspace = true }
regex = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_ignored = { workspace = true }
signal-hook = { workspace = true }
signal-hook-tokio = { workspace = true }
tokio = { workspace = true }
tokio-stream = { workspace = true }
toml = { workspace = true }
tracing = { workspace = true }
