[package]
name = "dictate-cli"
version.workspace = true
edition.workspace = true
license.workspace = true

# Installed as `dictate`: the verb Jake types, and short enough to keybind.
[[bin]]
name = "dictate"
path = "src/main.rs"

# Deliberately minimal. This binary runs on every dictation, so it depends on
# the protocol types and a socket — never on dictate-core, which would pull
# whisper.cpp and CUDA into a process that only writes JSON to a unix socket.
[dependencies]
anyhow = { workspace = true }
dictate-proto = { workspace = true }
dictate-stt = { workspace = true, default-features = false }
serde_json = { workspace = true }
tokio = { workspace = true }

# Test-only: tests/dict_roundtrip.rs drives this binary against the real daemon
# with mock hardware (port of the former scripts/test-dictionary-cli.py). These
# are dev-dependencies, so `cargo tree -p dictate-cli -e normal` (the justfile's
# whisper/dictate-fmt guard) is unaffected.
[dev-dependencies]
dictated = { workspace = true }
dictate-core = { workspace = true, features = ["test-support"] }
dictate-dict = { workspace = true }
dictate-fmt = { workspace = true }
dictate-history = { workspace = true }
dictate-vad = { workspace = true }
