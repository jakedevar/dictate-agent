[package]
name = "dictate-stt"
version.workspace = true
edition.workspace = true

[features]
default = ["cuda"]
# Provider/decode support is optional so the tiny control CLI can manage the
# model catalog without linking whisper.cpp or CUDA.
transcribe = ["dep:dictate-fmt", "dep:tokio", "dep:tracing", "dep:whisper-rs"]
# Production default: whisper.cpp CUDA on the RTX 5080.
cuda = ["transcribe", "whisper-rs/cuda"]
# CI/runtime fallback: selects tiny.en + CPU defaults. Combine with
# `--no-default-features` to ensure no CUDA backend is required.
cpu-tiny-ci = ["transcribe"]

[dependencies]
anyhow = { workspace = true }
dictate-fmt = { workspace = true, optional = true }
serde = { workspace = true }
tokio = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }
whisper-rs = { workspace = true, optional = true }
reqwest = { workspace = true }
sha2 = { workspace = true }
