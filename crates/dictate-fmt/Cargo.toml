[package]
name = "dictate-fmt"
version.workspace = true
edition.workspace = true

[features]
# Live LLM eval tier: `just eval-llm [model]` runs the corpus against a real
# Ollama and can re-record the committed fixtures. Off by default — unit tests
# need no network.
eval-live = []
# Optional local real-history tier: reads a history DB read-only and reports
# aggregates only. Pulls in rusqlite, so it is separate from eval-live.
eval-history = ["eval-live", "dep:rusqlite"]

[dependencies]
# FormatContext carries the protocol's AppContext/Tone/Route (contract §2).
# dictate-proto depends on nothing in the workspace, so this adds no cycle.
dictate-proto = { workspace = true }
serde = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
# S21 LLM layer (src/llm/); it also uses dictate-proto above (AppCategory,
# Tone, Route, SkipReason). reqwest is already in the graph through dictate-stt
# (and ollama-rs in dictate-core); the thin client needs its async API, status codes and raw
# bodies.
reqwest = { workspace = true, features = ["json"] }
serde_json = { workspace = true }
regex = { workspace = true }
toml = { workspace = true }
rusqlite = { workspace = true, optional = true }

[[example]]
name = "eval_llm"
required-features = ["eval-live"]
