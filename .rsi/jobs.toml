# Durable gate jobs for RSI's AgentSubmitJob {kind:"test", params:{recipe:NAME}} (RSI #1477).
# Each runs the local justfile target in the submitter's sandbox, survives the
# turn ending and a daemon restart, and wakes the submitter once with the result.
# cpu_quota_percent 800 = the host-etiquette 8 cores (shared 32-core host).
version = 1

[recipes.mac-parakeet-test]
runner = "just"
target = "mac-parakeet-test"
timeout_minutes = 30
cpu_quota_percent = 100

[recipes.mac-parakeet-bench]
runner = "just"
target = "mac-parakeet-bench"
timeout_minutes = 15
cpu_quota_percent = 100

# Worker gate: tests + clippy (3 feature lines) + fmt + dictate-cli tree check. CPU only.
[recipes.check-cpu]
runner = "just"
target = "check-cpu"
timeout_minutes = 60
cpu_quota_percent = 800

# Integrator gate: clippy with the CUDA backend (cold CUDA build is ~1000 CPU-s).
[recipes.check-cuda]
runner = "just"
target = "check-cuda"
timeout_minutes = 60
cpu_quota_percent = 800

# Integrator gate: real CUDA Whisper + Silero VAD end-to-end (GPU + model).
[recipes.e2e]
runner = "just"
target = "e2e"
timeout_minutes = 45
cpu_quota_percent = 800

[recipes.mac-test]
runner = "just"
target = "mac-test"
timeout_minutes = 15
cpu_quota_percent = 200

[recipes.mac-transport-verify]
runner = "just"
target = "mac-transport-verify"
timeout_minutes = 15
cpu_quota_percent = 800

[recipes.mac-dictated-setup]
runner = "just"
target = "mac-dictated-setup"
timeout_minutes = 20
cpu_quota_percent = 100

[recipes.mac-dictated-build]
runner = "just"
target = "mac-dictated-build"
timeout_minutes = 60
cpu_quota_percent = 100

[recipes.mac-dictated-test]
runner = "just"
target = "mac-dictated-test"
timeout_minutes = 60
cpu_quota_percent = 100

[recipes.mac-dictated-install]
runner = "just"
target = "mac-dictated-install"
timeout_minutes = 60
cpu_quota_percent = 100

[recipes.mac-dictated-smoke]
runner = "just"
target = "mac-dictated-smoke"
timeout_minutes = 10
cpu_quota_percent = 100
