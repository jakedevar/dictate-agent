[workspace]
resolver = "2"
members = ["crates/*"]
# The Tauri desktop UI (S32) is its own workspace: `cargo test --workspace`
# must never need webkit2gtk, and the UI must never link the daemon's stack.
exclude = ["ui/src-tauri"]

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"

# Config
toml = "0.8"
# Comment-preserving edits for `set_config` (S32). 0.22 is the line toml 0.8
# already links, so this adds no second parser to the build.
toml_edit = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Reports the keys a config file sets that no struct reads
serde_ignored = "0.1"

# Base64 — inline audio payloads in dictate-proto (see that crate's Cargo.toml)
base64 = "0.22"

# Duration parsing / regex
regex = "1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Error handling
anyhow = "1"
thiserror = "2"

# Process liveness probes for the PID file (kill(pid, 0))
libc = "0.2"

# Signal handling
signal-hook = "0.3"
signal-hook-tokio = { version = "0.3", features = ["futures-v0_3"] }

# Audio capture
cpal = "0.15"
# WAV decoding for uploaded audio (dictate-audio::decode)
hound = "3"
rodio = "0.20"

# Whisper transcription
# Build with WHISPER_DONT_GENERATE_BINDINGS=1 to use pre-generated bindings
whisper-rs = { version = "0.16" }

# Pinned GGUF model pulls and integrity verification.
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
sha2 = "0.10"

# CPU Silero VAD v5. The model is embedded by the crate; it does not require
# CUDA or an external model download.
voice_activity_detector = "0.2.1"

# Ollama client
ollama-rs = { version = "0.3", features = ["stream"] }

# Clipboard + keyboard
arboard = "3"
enigo = { version = "0.3", features = ["x11rb"] }
x11rb = "0.13"

# Desktop notifications
notify-rust = "4"

# SQLite
rusqlite = { version = "0.31", features = ["bundled"] }

# Misc
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
evdev = "0.13"

# Network API server (S33, dictate-server). HTTP/1.1 only, rustls on the ring
# provider rustls already uses here (no aws-lc C build).
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "ws", "query"] }
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio", "server", "http1", "service"] }
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "logging", "tls12"] }
getrandom = "0.2"

# Workspace crates
dictate-audio = { path = "crates/dictate-audio" }
dictate-cli = { path = "crates/dictate-cli" }
dictate-core = { path = "crates/dictate-core" }
dictate-context = { path = "crates/dictate-context" }
dictate-fmt = { path = "crates/dictate-fmt" }
dictate-history = { path = "crates/dictate-history" }
dictate-inject = { path = "crates/dictate-inject" }
dictate-proto = { path = "crates/dictate-proto" }
dictate-stt = { path = "crates/dictate-stt", default-features = false }
dictate-vad = { path = "crates/dictate-vad" }
dictate-hotkey = { path = "crates/dictate-hotkey" }
dictated = { path = "crates/dictated" }
dictate-dict = { path = "crates/dictate-dict" }
dictate-server = { path = "crates/dictate-server" }

[profile.release]
opt-level = 3
lto = true
strip = true
