# Dictate Agent Configuration (Rust version)
# Copy to ~/.config/dictate-agent/config.toml

[audio]
# Whether this daemon may use the microphone at all. `false` is "audio-less
# mode": no input device is ever opened, `dictate toggle`/`start` fail with a
# clear error, and only uploaded audio works (`dictate transcribe file.wav`).
# Use it for servers, CI, and the isolated daemons the E2E tests start.
capture = true
# Exact PipeWire/ALSA input device name. Empty uses the system default.
input_device = ""
# Keep audio immediately before the hotkey so the first syllable is not clipped.
#
# PRIVACY TRADE-OFF: a non-zero pre-roll means the input device is held OPEN
# WHILE IDLE (your desktop's microphone indicator stays lit) so a ring buffer
# can hold the last few hundred milliseconds. Nothing beyond that ring is kept,
# and it is discarded after every session, but the device is open around the
# clock. `pre_roll_ms = 0` closes the device between recordings: it is opened
# when a recording starts and released on stop/cancel, at the cost of clipping
# the first syllable if you speak the instant you press the key.
# `dictate status` shows whether the device is open right now (`mic: open`).
pre_roll_ms = 300
# Preserve final words after the stop hotkey.
trailing_capture_ms = 500
# Reopen the selected/default device on the next start after a hotplug error.
hotplug_recovery = true
# Warn after this much effectively silent captured audio (does not fail dictation).
mic_mute_warning = true
mic_mute_min_ms = 900
mic_mute_rms = 0.0015

[audio.gain]
# Bounded AGC makes whisper-quiet speech more audible to Whisper.
enabled = true
target_rms = 0.12
min_gain = 1.0
max_gain = 8.0
silence_rms = 0.002

[audio.earcons]
# Opt in to short start/stop/cancel/error chimes; existing installs remain silent.
enabled = false
volume = 0.18

[whisper]
# Pinned catalog model. `dictate model pull` downloads with Range-resume and
# SHA-256 verification. The daemon also pulls the named catalog model at its
# first load when it is absent.
model = "large-v3-turbo"

# Explicit GGUF path (kept for offline/custom models). The default is the
# catalog location for `model`; custom existing paths are not downloaded.
model_path = "~/.local/share/dictate-agent/models/ggml-large-v3-turbo.bin"

# Device: "cuda" for GPU (RTX), "cpu" for CPU-only
device = "cuda"

# Threshold for filtering non-speech (0.0-1.0, higher = stricter)
no_speech_threshold = 0.6

# `auto` detects the spoken language; set e.g. "en", "fr", or "ja" to pin it.
language = "auto"

# Optional dictionary/jargon bias. S22 will populate this automatically.
initial_prompt = ""

# A config written for the Python-era daemon names this by Hugging Face id
# (`model = "openai/whisper-large-v3-turbo"`). That still loads: known ids are
# mapped to the catalog name above with a warning. Unknown keys are never
# silently ignored — `dictated --check-config` lists every one.

[vad]
# CPU Silero VAD: skip STT for silence and trim silence around speech.
enabled = true
# Higher values are stricter. Tune against the bundled fixtures and real mic.
speech_threshold = 0.5
min_speech_ms = 120
speech_pad_ms = 100
# `one_shot` and wake-word sessions end after this post-speech silence.
trailing_silence_ms = 900
poll_interval_ms = 32

[format]
# Deterministic text cleanup between transcription and routing: pure Rust,
# well under a millisecond, no network. Off = the raw Whisper text is routed
# and typed as-is. URLs, paths, slash commands and code identifiers stay
# protected from the [grammar] LLM pass even when this is off.
enabled = true

[format.rules]
# Historical Whisper fixes: cloud/clod/clawed -> Claude, .cloud/ -> .claude/,
# and "create plan", "implement plan", "validate plan", "create handoff",
# "research code base" -> /create_plan, /implement_plan, /validate_plan,
# /create_handoff, /research_codebase. Whole words only ("cloudy" is safe).
builtin_corrections = true
# Drop whisper.cpp's [BLANK_AUDIO], a trailing /no_think, and a trailing
# stand-alone "Thank you." (Whisper's silence hallucination); normalize spaces.
hallucination_scrub = true
# Remove um, uh, erm, hmm, mm. Never "like", "you know", "so", "actually".
fillers = true
# "the the" -> "the", "wh- what" -> "what". Keeps "that that", "very very".
stutters = true
# "twenty five" -> 25, "three point five percent" -> 3.5%, "ten dollars" -> $10,
# "five thirty pm" -> 5:30 PM. A lone number below ten stays a word
# ("two people") unless a unit, percent or currency follows.
numbers = true
# Capitalize sentence starts and the pronoun I (a loop variable i stays).
casing = true
# Collapse spaces; no space before , ; ! ? and sentence-ending . :
spacing = true
# End utterances of four or more words with "." (not after a path or command).
terminal_punctuation = true
# Off by default: in code prompts "period", "colon" and "new line" are often
# literal words. Per-app profiles can turn these on.
spoken_punctuation = false
spoken_line_breaks = false

[grammar]
# LLM grammar pass: runs after routing, on the [format] output, for typed
# (route = type) text only. Output that alters a protected span is rejected.
enabled = false
host = "http://localhost:11434"
model = "qwen3:0.6b"
timeout_s = 10.0
# Skip correction for short inputs (preserves trigger words like "timer")
min_words = 3

[upload]
# Limits on audio uploaded with `transcribe_audio` / `dictate transcribe`.
# An upload is decoded and resampled in memory, so it is bounded.
max_audio_seconds = 600
# Largest payload, in bytes of audio data (a 16 kHz mono 16-bit WAV is ~1.9 MB/min).
max_bytes = 67108864

[local]
# (`[router]` in a Python-era config is read as this section, with a warning.)
# Ollama configuration for local inference (triggered by "easy/simple/medium/hard" prefix)
host = "http://localhost:11434"
model = "qwen3:14b"
timeout_s = 120.0

[output]
# Automatically type transcribed/response text via clipboard paste
auto_type = true
# `paste`, `type`, or `off`. A backend without safe clipboard save/restore
# automatically resolves `paste` to `type`.
policy = "paste"
# Maximum Unicode scalar values sent per direct-typing operation.
type_chunk_chars = 512

[notifications]
# Desktop notifications via notify-rust (D-Bus, no subprocess)
enabled = true
timeout_ms = 1250

[history]
# Interaction history logging to SQLite
enabled = true
# Database location (empty = the daemon's distinct XDG data database)
db_path = ""
# Truncate stored responses beyond this length (characters)
max_response_length = 10000
# Do not persist any dictation. `SessionOptions.privacy` enables the same
# guarantee for one request without changing this global setting.
privacy_mode = false
# Remove rows older than this many UTC days. Omit to retain indefinitely.
# retention_days = 90
# One-time, read-only import from ~/.local/share/dictate-agent/history.db.
# The Python database is never modified and each source is imported once.
import_python_db = false

[timer]
# Timer alarm configuration
sound_enabled = true
sound_file = "~/.config/dictate-agent/sounds/timer_alarm.wav"

# Optional global evdev hotkeys. The existing WM keybinds and
# scripts/dictate-toggle remain first-class whether this is enabled or not.
# Enable only after the daemon user can read the selected /dev/input/event*
# device (normally: `sudo usermod -aG input $USER`, then log out and back in).
# Each chord is a list of Linux KEY_* numeric values from
# /usr/include/linux/input-event-codes.h. Devices are observed passively, so
# ordinary keyboard input continues reaching X11/Wayland applications.
[hotkey]
enabled = false
devices = ["/dev/input/by-id/replace-with-your-keyboard-event-kbd"]
# KEY_SPACE: hold starts recording; release stops after the double-tap window.
hold_to_talk = [57]
# Example independent toggle key (KEY_F12). Empty chords disable a mode.
toggle = [88]
# Static cancel chord, available throughout a session (KEY_LEFTCTRL + KEY_LEFTALT).
cancel = [29, 56]
# Absorbs hardware/X11 auto-repeat key-up bursts before ending a hold.
release_grace_ms = 45
# A second hold-key press inside this window locks hands-free mode. Because the
# daemon must know whether a second press is coming, a normal release is
# deferred for this long (or release_grace_ms, whichever is greater).
double_tap_ms = 320

# App context (S23). X11 focus is captured once, before audio starts. Headless
# and Wayland (without a compositor adapter) use global defaults, with no title.
# Every category uses neutral tone. Terminals disable LLM formatting and spoken
# punctuation/line breaks by default, but keep the global Ctrl+V paste policy.
[context]
enabled = true
# Profiles match in file order: first matching user profile wins, then browser
# Gmail/Outlook title rules, then built-in class categories, then Other.
# class/instance are case-insensitive exact matches or globs (* and ?).
# title is a regex; all specified match fields must match. Supplied app IDs
# from remote/upload clients have no title or instance. Unknown keys warn once
# at load. Unknown values and invalid regexes fail with the profile name.
# category: terminal | editor | browser | chat | email | document | other
# tone: formal | neutral | casual | very_casual (tone shifts are opt-in)
# Optional llm_format/spoken_punctuation/spoken_line_breaks: true | false;
# absent inherits category/global defaults. inject: paste | type | off;
# absent inherits output.policy. Paste still obeys backend capability downgrade.
# No window titles are stored in history; privacy mode stores no context.
# Use `dictate context` or `dictate context --json` to discover your app/profile.
#
# [[context.profiles]]
# name = "slack-casual"
# match = { class = "slack" }
# category = "chat"
# tone = "casual"
#
# [[context.profiles]]
# name = "gmail-formal"
# match = { class = "google-chrome", title = "(?i)gmail" }
# category = "email"
# tone = "formal"
#
# [[context.profiles]]
# name = "claude-code"
# match = { class = "com.mitchellh.ghostty", title = "(?i)claude" }
# category = "terminal"
# tone = "neutral"
# llm_format = false
# inject = "paste"
# spoken_punctuation = false
# spoken_line_breaks = false

# Personal dictionary (empty until entries are added with `dictate dict add`).
[dictionary]
enabled = true
# Empty uses $XDG_DATA_HOME/dictated/dictionary.db; ~/ paths are expanded.
db_path = ""
stt_bias = true
# Static whisper.initial_prompt plus glossary: hard cap 400 chars/UTF-8 bytes.
max_prompt_chars = 400
recase_phrases = true
# Exact aliases are conservative. Fuzzy matching is experimental, opt-in.
fuzzy = false
# Single-token edit similarity, 0.8..1.0; short words and ambiguous matches skip.
fuzzy_threshold = 0.9
